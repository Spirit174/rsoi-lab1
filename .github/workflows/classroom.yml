name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
      - develop
    pull_request:
      branches:
        - master
        - develop
      
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        
      - name: .Net
        uses: actions/setup-dotnet@v3 
        with: 
          dotnet-version: '9.0.x'
            
      - name: Dependencies
        run: dotnet restore src/Person/Person.sln
        
      - name: Publish
        run: dotnet publish src/Person/Person.Server/Person.Server.csproj -c Release -o PersonPublish
        
      - name: Docker Image
        run: |
          docker build -t backend:latest ./
          docker save backend:latest > backend.tar
          
      - name: Save Image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar
        
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - uses: actions/checkout@v3
            
      - name: .Net
        uses: actions/setup-dotnet@v3 
        with: 
          dotnet-version: '9.0.x'
                
      - name: Run Unit Tests
        run: dotnet test src/Person/Person.sln
        
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Image 
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          
      - name: Copy Image 
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "backend.tar"
          target: "/home/rsoitema/"
          owerwrite: true
          
      - name: Copy Docker 
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml"
          target: "/home/rsoitema/"
          overwrite: true
          
      - name: Deploy app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/rsoitema/
            
            # Load Docker image
            docker load -i backend.tar
            
            # Check if image loaded successfully
            docker images | grep backend || echo "Pu pu pu"
            
            # Stop and remove old containers
            docker-compose down || true
            
            # Start new containers
            docker-compose up -d
            
            # Wait for services to start
            sleep 10
            
            # Check running containers
            docker ps
            
            echo "Deploy success"
            
    integration-tests:
    name: Autograding
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autogradings
        uses: education/autograding@v1
        continue-on-error: true          
  